name: Publish to npm and GitHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: write # Required to create release tags and GitHub releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Verify package in Node
        run: |
          PACKAGE=$(npm pack --silent)
          mkdir /tmp/opencode-wakelock-smoke
          npm install --prefix /tmp/opencode-wakelock-smoke "$PWD/$PACKAGE"
          cd /tmp/opencode-wakelock-smoke
          node --input-type=module -e "const plugin = (await import('opencode-wakelock')).default; if (plugin.id !== 'opencode-wakelock' || typeof plugin.server !== 'function') process.exit(1)"

      - name: Check if version already published
        id: check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already published"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not published yet"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      # Also run when npm already has this version, so a failed GitHub release
      # step can be retried without republishing the package.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="v$PACKAGE_VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          # npm can accept publication before registry reads see the version.
          # Wait up to five minutes, including when recovering a partial run.
          # Always tag the published commit, not newer, unpublished changes.
          for attempt in {1..30}; do
            if PUBLISHED_COMMIT=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead --prefer-online) &&
              [[ "$PUBLISHED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Cannot determine the published commit for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
              exit 1
            fi
            echo "Waiting for npm registry propagation ($attempt/30)"
            sleep 10
          done

          LATEST_VERSION=$(npm view "$PACKAGE_NAME" dist-tags.latest --prefer-online)
          RELEASE_FLAGS=()
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          elif [[ "$PACKAGE_VERSION" == "$LATEST_VERSION" ]]; then
            RELEASE_FLAGS+=(--latest)
          else
            RELEASE_FLAGS+=(--latest=false)
          fi

          # Creating a release with an implicit tag at an older commit can
          # require workflows:write, which GITHUB_TOKEN cannot request.
          # Create the reference first, then publish against the existing tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            if [[ "$TAG_COMMIT" != "$PUBLISHED_COMMIT" ]]; then
              echo "Existing tag $TAG does not match the published npm commit" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field "ref=refs/tags/$TAG" \
              --raw-field "sha=$PUBLISHED_COMMIT"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "Published to npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION" \
            "${RELEASE_FLAGS[@]}"
